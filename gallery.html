<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Our Memory Moments ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@500;600;700&display=swap" rel="stylesheet" />

<!-- Standalone stylesheet on purpose: keeps the gallery fully separate from
     the letter's style.css so photos / layout can be tweaked here without
     touching index.html at all. -->
<link rel="stylesheet" href="gallery.css" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>

  <header class="gallery-topbar">
    <a class="back-link" href="index.html" aria-label="Kembali ke surat">← Back to Letter</a>
    <div class="gallery-title">
      <span class="eyebrow">A Little Collection Of</span>
      <h1>Our Memory Moments ❤️</h1>
    </div>
  </header>

  <main class="gallery-stage" id="galleryStage" aria-label="Kolase foto kenangan yang bergulir">
    <!-- Columns are generated by gallery.js -->
  </main>

  <button class="download-btn" id="downloadBtn" aria-label="Unduh kartu kenangan">
    <span class="download-icon">⬇</span>
    <span id="downloadLabel">Unduh</span>
  </button>

  <!-- Hidden canvas used to compose the downloadable keepsake card -->
  <canvas id="exportCanvas" width="1080" height="1440" style="display:none;"></canvas>

  <div class="toast" id="galleryToast" role="status" aria-live="polite"></div>

  <script src="photo-data.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
